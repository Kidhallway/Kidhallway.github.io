<!DOCTYPE html>
<html>
    <title>
        Roulette
    </title>
    <body style="display: block;margin: 8px;" id="background">
            <h1 style="font-size: 76px;line-height: 76px;height: 76px;font-family: Helvetica, sans-serif;font-weight: bold;position: fixed;top: 50%;margin-top: -38px;width: 100%;text-align: center;">
            <button id="button" type="button">
                Good Luck!
            </button>
<h1>Score:</h1>
<h1 id="score">0</h1>
        </h1>
        </div>
        <script> 
            const btn = document.getElementById("button")
            let score = 0
            btn.onclick =() => {
            console.log("hello")
            let goal = document.getElementById('score');
            if(Math.random() <= 0){
                score = 0
                goal.textContent = (score)
                console.log(score)
                console.log("badluck")
                document.getElementById("background").style.backgroundColor="Red"
                setTimeout(function(){
                document.getElementById("background").style.backgroundColor="white",
                window.open("./oops.html")
                }, 2000);

            } else {
                console.log("goodluck")
                document.getElementById("background").style.backgroundColor="limeGreen"
                score = score + 1
                goal.textContent = (score)
                console.log(score)
                setTimeout(function(){
                document.getElementById("background").style.backgroundColor="white"
                }, 2000);

            }
            }

            </script>
    </body>
